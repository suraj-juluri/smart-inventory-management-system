<div class="update-stock">

  <h1>Update Stock</h1>

  <form (ngSubmit)="updateStock()">

    <div class="form-group">
      <label>Product ID</label>

      <input
        type="number"
        name="productId"
        [(ngModel)]="productId"
        placeholder="Enter Product ID"
        min="1"
        required
      />
    </div>

    <div class="form-group">
      <label>New Quantity</label>

      <input
        type="number"
        name="quantity"
        [(ngModel)]="quantity"
        placeholder="Enter New Quantity"
        min="0"
        required
      />
    </div>

    <button type="submit">
      Update Stock
    </button>

  </form>

</div>
