<div class="edit-product">

  <h1>Edit Product</h1>

  <form (ngSubmit)="updateProduct()">

    <div class="form-group">
      <label>Product Name</label>

      <input
        type="text"
        name="productName"
        [(ngModel)]="product.productName"
        placeholder="Enter product name"
        required
      />
    </div>

    <div class="form-group">
      <label>Category</label>

      <input
        type="text"
        name="category"
        [(ngModel)]="product.category"
        placeholder="Enter category"
        required
      />
    </div>

    <div class="form-group">
      <label>Price</label>

      <input
        type="number"
        name="price"
        [(ngModel)]="product.price"
        min="0"
        required
      />
    </div>

    <div class="form-group">
      <label>Quantity</label>

      <input
        type="number"
        name="quantity"
        [(ngModel)]="product.quantity"
        min="0"
        required
      />
    </div>

    <div class="form-group">
      <label>Minimum Stock</label>

      <input
        type="number"
        name="minimumStock"
        [(ngModel)]="product.minimumStock"
        min="0"
        required
      />
    </div>

    <button type="submit">
      Update Product
    </button>

    <button
      type="button"
      class="cancel-button"
      (click)="router.navigate(['/products'])">
      Cancel
    </button>

  </form>

</div>
